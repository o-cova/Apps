<script>
// ============================================================
//  ELEMENTS
// ============================================================
const hiddenInput = document.getElementById('hiddenInput');

// ============================================================
//  SCREEN — 40x25 canvas grid
// ============================================================
const COLS=40, ROWS=25;
const canvas  = document.getElementById('screenCanvas');
const ctx     = canvas.getContext('2d');
const CWIDTH  = canvas.width  / COLS;   // 14px
const CHEIGHT = canvas.height / ROWS;   // 16px
const FG = '#a0a0ff', BG = '#3838b8', CUR_BG = '#c0c0ff', CUR_FG = '#181870';
const FONT = `bold ${Math.round(CHEIGHT*0.82)}px 'Share Tech Mono', monospace`;

// Grid: array of {ch, fg, bg}
let grid = Array.from({length:ROWS}, ()=>Array.from({length:COLS}, ()=>({ch:' ',fg:FG,bg:BG})));
let curRow=0, curCol=0;          // current text output position
let locateRow=-1, locateCol=-1;  // pending LOCATE target (-1 = none)
let cursorVisible=true;
setInterval(()=>{ cursorVisible=!cursorVisible; renderCursor(); }, 500);

function cellSet(r,c,ch,fg,bg){
  if(r<0||r>=ROWS||c<0||c>=COLS) return;
  grid[r][c]={ch:ch||' ',fg:fg||FG,bg:bg||BG};
  drawCell(r,c);
}

function drawCell(r,c){
  const x=c*CWIDTH, y=r*CHEIGHT;
  const cell=grid[r][c];
  ctx.fillStyle=cell.bg; ctx.fillRect(x,y,CWIDTH,CHEIGHT);
  if(cell.ch&&cell.ch!==' '){
    ctx.fillStyle=cell.fg; ctx.font=FONT; ctx.textBaseline='top';
    ctx.fillText(cell.ch, x+1, y+1);
  }
}

function redrawAll(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) drawCell(r,c);
  renderCursor();
}

function renderCursor(){
  // erase old cursor spot by redrawing cell
  drawCell(curRow, curCol);
  if(cursorVisible && !waitingForInput){
    // blink block over current char
    const r=curRow, c=curCol;
    const x=c*CWIDTH, y=r*CHEIGHT;
    ctx.fillStyle=CUR_BG; ctx.fillRect(x,y,CWIDTH,CHEIGHT);
    const ch=grid[r][c].ch||' ';
    if(ch!==' '){ ctx.fillStyle=CUR_FG; ctx.font=FONT; ctx.textBaseline='top'; ctx.fillText(ch,x+1,y+1); }
  }
}

// Scroll screen up one row
function scrollUp(){
  grid.shift();
  grid.push(Array.from({length:COLS},()=>({ch:' ',fg:FG,bg:BG})));
  redrawAll();
}

// Advance cursor, scrolling if needed
function advance(){
  curCol++;
  if(curCol>=COLS){ curCol=0; curRow++; }
  if(curRow>=ROWS){ scrollUp(); curRow=ROWS-1; }
}

function newLine(){
  curCol=0; curRow++;
  if(curRow>=ROWS){ scrollUp(); curRow=ROWS-1; }
}

// Core print-a-string at current cursor (or locate position)
function screenPrint(text){
  // Apply pending LOCATE
  if(locateRow>=0){
    curRow=Math.max(0,Math.min(ROWS-1, locateRow));
    curCol=Math.max(0,Math.min(COLS-1, locateCol));
    locateRow=-1; locateCol=-1;
  }
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='\n'){ newLine(); continue; }
    if(ch==='\t'){
      // advance to next multiple of 8
      const next=Math.ceil((curCol+1)/8)*8;
      while(curCol<next && curCol<COLS){ cellSet(curRow,curCol,' '); advance(); }
      continue;
    }
    cellSet(curRow,curCol,ch.toUpperCase());
    advance();
  }
  renderCursor();
}

function printLine(t){ screenPrint(t+'\n'); }
function print(t)    { screenPrint(t); }
function screenClear(){
  grid=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>({ch:' ',fg:FG,bg:BG})));
  curRow=0; curCol=0;
  redrawAll();
}

// Input line rendering on canvas
function renderInputLine(){
  // Apply pending LOCATE for input too
  if(locateRow>=0){
    curRow=Math.max(0,Math.min(ROWS-1, locateRow));
    curCol=Math.max(0,Math.min(COLS-1, locateCol));
    locateRow=-1; locateCol=-1;
  }
  // Redraw input buffer chars at current row from inputStartCol
  // We store input start so we can repaint
  const startRow=inputStartRow, startCol=inputStartCol;
  // Clear from start to end of line
  for(let c=startCol;c<COLS;c++) cellSet(startRow,c,' ');
  // Print buffer
  let r=startRow, c=startCol;
  for(let i=0;i<inputBuffer.length;i++){
    cellSet(r,c,inputBuffer[i].toUpperCase());
    c++; if(c>=COLS){c=0;r++; if(r>=ROWS){scrollUp();r=ROWS-1;}}
  }
  // Draw cursor at cursorPos
  let cr=startRow, cc=startCol+cursorPos;
  while(cc>=COLS){cc-=COLS;cr++;}
  curRow=cr; curCol=cc;
  renderCursor();
}

// ============================================================
//  STATE
// ============================================================
let program={}, variables={}, arrays={};
let running=false, lineNumbers=[], currentLineIndex=0;
let inputBuffer='', cursorPos=0, waitingForInput=false, inputResolve=null;
let inputStartRow=0, inputStartCol=0;
let forStack=[], gosubStack=[], dataList=[], dataPointer=0;
let cmdHistory=[], historyIndex=-1;

// ============================================================
//  BOOT
// ============================================================
function boot(){
  screenClear();
  printLine('   **** COMMODORE 64 BASIC V2 ****');
  printLine('');
  printLine(' 64K RAM SYSTEM  38911 BASIC BYTES FREE');
  printLine('');
  printLine('READY.');
  printLine('');
}

// ============================================================
//  TERMINAL INPUT — cursor-positioned editor
// ============================================================
function focusInput(){ hiddenInput.focus(); }

// The hidden input just captures keypresses — we manage buffer ourselves
hiddenInput.addEventListener('keydown', async(e)=>{
  // Keys that need default prevention
  const nav = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'];
  if(nav.includes(e.key)) e.preventDefault();

  if(e.key==='Enter'){
    e.preventDefault();
    const line = inputBuffer;
    inputBuffer=''; cursorPos=0;
    hiddenInput.value='';
    // move cursor to end of typed text then newline
    curRow=inputStartRow; curCol=inputStartCol+line.length;
    while(curCol>=COLS){curCol-=COLS;curRow++;}
    newLine();
    if(line.trim()){ cmdHistory.unshift(line); historyIndex=-1; }
    if(waitingForInput){ waitingForInput=false; if(inputResolve){inputResolve(line);inputResolve=null;} return; }
    await processInput(line.trim());

  } else if(e.key==='ArrowLeft'){
    if(cursorPos>0){ cursorPos--; renderInputLine(); }

  } else if(e.key==='ArrowRight'){
    if(cursorPos<inputBuffer.length){ cursorPos++; renderInputLine(); }

  } else if(e.key==='Home' || (e.key==='ArrowLeft'&&e.ctrlKey)){
    cursorPos=0; renderInputLine();

  } else if(e.key==='End' || (e.key==='ArrowRight'&&e.ctrlKey)){
    cursorPos=inputBuffer.length; renderInputLine();

  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(historyIndex<cmdHistory.length-1){
      historyIndex++;
      inputBuffer=cmdHistory[historyIndex];
      cursorPos=inputBuffer.length;
      hiddenInput.value='';
      // restore to input start
      curRow=inputStartRow; curCol=inputStartCol;
      renderInputLine();
    }

  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(historyIndex>0){ historyIndex--; inputBuffer=cmdHistory[historyIndex]; }
    else { historyIndex=-1; inputBuffer=''; }
    cursorPos=inputBuffer.length;
    hiddenInput.value='';
    curRow=inputStartRow; curCol=inputStartCol;
    renderInputLine();

  } else if(e.key==='Backspace'){
    if(cursorPos>0){
      inputBuffer = inputBuffer.slice(0,cursorPos-1) + inputBuffer.slice(cursorPos);
      cursorPos--;
      hiddenInput.value='';
      renderInputLine();
    }

  } else if(e.key==='Delete'){
    if(cursorPos<inputBuffer.length){
      inputBuffer = inputBuffer.slice(0,cursorPos) + inputBuffer.slice(cursorPos+1);
      hiddenInput.value='';
      renderInputLine();
    }

  } else if(e.key.length===1 && !e.ctrlKey && !e.metaKey){
    // Printable character — insert at cursor
    const ch = e.key.toUpperCase();
    inputBuffer = inputBuffer.slice(0,cursorPos) + ch + inputBuffer.slice(cursorPos);
    cursorPos++;
    hiddenInput.value='';
    renderInputLine();
  }
});

document.addEventListener('keydown',(e)=>{
  if(e.key==='F5'){ e.preventDefault(); doRun(); }
  if(e.key==='Escape'&&running){ running=false; printLine('\nBREAK'); printLine('READY.'); printLine(''); setInputStart(); }
});

async function processInput(line){
  if(!line){
    printLine('READY.'); printLine('');
    setInputStart(); return;
  }
  const m=line.match(/^(\d+)\s*(.*)/);
  if(m){
    const num=parseInt(m[1]), rest=m[2].trim();
    if(rest==='') delete program[num]; else program[num]=rest;
    syncEditorFromProgram();
    setInputStart(); return;
  }
  await executeStatement(line);
  setInputStart();
}

function setInputStart(){
  inputStartRow=curRow; inputStartCol=curCol;
  renderCursor();
}

// ============================================================
//  TOOLBAR
// ============================================================
async function doRun(){
  screenClear();
  boot();
  await cmdRun();
  setInputStart();
}

function doStop(){
  if(running){ running=false; printLine('\nBREAK'); printLine('READY.'); printLine(''); }
  else { printLine('READY.'); printLine(''); }
  setEditorStatus('READY','status-ok');
  setInputStart(); focusInput();
}

function doList(){ loadEditorToProgram(); cmdList(); focusInput(); }

function doNew(){
  if(!confirm('NEW: erase program and variables?')) return;
  program={}; variables={}; arrays={};
  screenClear(); printLine('NEW'); printLine(''); printLine('READY.'); printLine('');
  setInputStart();
  focusInput();
}

function doSave(){
  loadEditorToProgram();
  const nums=Object.keys(program).map(Number).sort((a,b)=>a-b);
  if(!nums.length){ printLine('?NOTHING TO SAVE'); printLine(''); focusInput(); return; }
  const text=nums.map(n=>n+' '+program[n]).join('\n');
  const name=(prompt('Save as (filename):','program')||'program').replace(/\.bas$/i,'');
  const blob=new Blob([text],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name+'.bas'; a.click();
  URL.revokeObjectURL(a.href);
  printLine('SAVING "'+name.toUpperCase()+'"'); printLine('OK'); printLine('READY.'); printLine('');
  setInputStart(); focusInput();
}

function loadFromFile(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    const text=ev.target.result.toUpperCase();
    program={};
    let loaded=0;
    for(const line of text.split('\n')){
      const m=line.trim().match(/^(\d+)\s+(.+)/);
      if(m){ program[parseInt(m[1])]=m[2]; loaded++; }
    }
    syncEditorFromProgram();
    printLine('LOADING "'+file.name.toUpperCase().replace('.BAS','')+'"');
    printLine(loaded+' LINES LOADED'); printLine(''); printLine('READY.'); printLine('');
    setInputStart(); focusInput();
  };
  reader.readAsText(file); e.target.value='';
}

// ============================================================
//  EDITOR SYNC STUBS (no editor panel)
// ============================================================
function loadEditorToProgram(){ /* program already up to date */ }
function syncEditorFromProgram(){ /* no editor to sync */ }
function updateLineNumbers(){}
function updateEditorStatus(){}
function setEditorStatus(){}
function switchTab(){}
function refreshVars(){}
function doFormat(){}
function doInsertLine(){}
function doFind(){}
function doReplace(){}
function doReplaceAll(){}
function gotoEditorLine(){}
function doRenumber(){
  const start=10, step=10;
  execRenumber(start, step);
  focusInput();
}

function cmdRenumber(stmt){
  // RENUM [start[,step]]  — defaults: 10, 10
  const args = stmt.replace(/^RENUM(BER)?\s*/,'').trim();
  let start=10, step=10;
  if(args){
    const parts = args.split(/[\s,]+/);
    if(parts[0]) start = parseInt(parts[0])||10;
    if(parts[1]) step  = parseInt(parts[1])||10;
  }
  loadEditorToProgram();
  execRenumber(start, step);
}

function execRenumber(start, step){
  const nums=Object.keys(program).map(Number).sort((a,b)=>a-b);
  if(!nums.length){ printLine('?NO PROGRAM'); printLine(''); return; }
  const map={};
  nums.forEach((n,i)=>{ map[n]=start+i*step; });
  const newProg={};
  for(const n of nums){
    let code=program[n];
    code=code.replace(/\b(GOTO|GOSUB|THEN|RUN)\s+(\d+)/g,
      (_,kw,t)=>kw+' '+(map[parseInt(t)]!==undefined ? map[parseInt(t)] : t));
    newProg[map[n]]=code;
  }
  program=newProg;
  syncEditorFromProgram();
  printLine('RENUMBERED '+nums.length+' LINES ('+start+','+step+')');
  printLine('READY.'); printLine('');
  setInputStart();
}

// ---- LOCATE ----
function cmdLocate(args){
  // LOCATE row, col   (1-based like most BASICs)
  const parts = args.trim().split(/\s*,\s*/);
  const row = parseInt(evalExpr(parts[0]||'1')) - 1;  // convert to 0-based
  const col = parseInt(evalExpr(parts[1]||'1')) - 1;
  locateRow = Math.max(0, Math.min(ROWS-1, row));
  locateCol = Math.max(0, Math.min(COLS-1, col));
}

// ---- FIND / REPLACE ----
function doFind(){
  const query=document.getElementById('findInput').value.toUpperCase();
  const resultsEl=document.getElementById('findResults');
  if(!query){ resultsEl.innerHTML='<div class="var-empty">Enter text to search.</div>'; return; }
  const lines=codeEditor.value.split('\n');
  const matches=lines.map((l,i)=>({i:i+1,text:l})).filter(x=>x.text.toUpperCase().includes(query));
  if(!matches.length){ resultsEl.innerHTML='<div class="var-empty">NOT FOUND: '+query+'</div>'; return; }
  const esc=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  resultsEl.innerHTML=matches.map(m=>{
    const hi=m.text.replace(new RegExp(esc,'gi'),s=>'<span style="background:#3a3080;color:#ffff80">'+s+'</span>');
    return `<div class="find-result" onclick="gotoEditorLine(${m.i})"><span class="fr-num">${m.i}</span><span class="fr-text">${hi}</span></div>`;
  }).join('');
  gotoEditorLine(matches[0].i);
}

function doReplace(){
  const query=document.getElementById('findInput').value.toUpperCase();
  const repl=document.getElementById('replaceInput').value.toUpperCase();
  if(!query) return;
  const text=codeEditor.value;
  const idx=text.toUpperCase().indexOf(query);
  if(idx===-1){ document.getElementById('findResults').innerHTML='<div class="var-empty">NOT FOUND</div>'; return; }
  codeEditor.value=text.slice(0,idx)+repl+text.slice(idx+query.length);
  codeEditor.selectionStart=idx; codeEditor.selectionEnd=idx+repl.length;
  updateLineNumbers(); updateEditorStatus(); doFind();
}

function doReplaceAll(){
  const query=document.getElementById('findInput').value.toUpperCase();
  const repl=document.getElementById('replaceInput').value.toUpperCase();
  if(!query) return;
  const esc=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const count=(codeEditor.value.toUpperCase().match(new RegExp(esc,'g'))||[]).length;
  codeEditor.value=codeEditor.value.replace(new RegExp(esc,'gi'),repl);
  document.getElementById('findResults').innerHTML=`<div class="var-row"><span class="var-val">${count} replacement(s) made.</span></div>`;
  updateLineNumbers(); updateEditorStatus();
}

function gotoEditorLine(lineNum){
  codeEditor.focus();
  const lines=codeEditor.value.split('\n');
  let pos=0;
  for(let i=0;i<lineNum-1&&i<lines.length;i++) pos+=lines[i].length+1;
  codeEditor.selectionStart=codeEditor.selectionEnd=pos;
  const lh=parseFloat(getComputedStyle(codeEditor).lineHeight)||19;
  codeEditor.scrollTop=(lineNum-1)*lh-codeEditor.clientHeight/2;
}

// ============================================================
//  BASIC INTERPRETER
// ============================================================
async function executeStatement(stmt){
  stmt=stmt.trim(); if(!stmt) return;
  for(const s of splitStatements(stmt)) await execSingle(s.trim());
}

function splitStatements(line){
  const parts=[];let cur='',inStr=false;
  for(const ch of line){
    if(ch==='"') inStr=!inStr;
    if(ch===':'&&!inStr){parts.push(cur);cur='';}else cur+=ch;
  }
  parts.push(cur);return parts;
}

async function execSingle(stmt){
  if(!stmt) return;
  try{
    if(stmt.startsWith('PRINT')||stmt.startsWith('?')) await cmdPrint(stmt.startsWith('?')?stmt.slice(1):stmt.slice(5));
    else if(stmt.startsWith('LET ')||stmt.match(/^[A-Z][A-Z0-9]*\$?\s*(\(.*\))?\s*=/)) cmdLet(stmt.startsWith('LET ')?stmt.slice(4):stmt);
    else if(stmt.startsWith('INPUT'))  await cmdInput(stmt.slice(5));
    else if(stmt.startsWith('IF '))    await cmdIf(stmt.slice(3));
    else if(stmt.startsWith('FOR '))   cmdFor(stmt.slice(4));
    else if(stmt.startsWith('NEXT'))   await cmdNext(stmt.slice(4));
    else if(stmt.startsWith('GOTO '))  await cmdGoto(stmt.slice(5));
    else if(stmt.startsWith('GOSUB ')) await cmdGosub(stmt.slice(6));
    else if(stmt.startsWith('RETURN')) cmdReturn();
    else if(stmt==='END'||stmt==='STOP'){ running=false; printLine('\nBREAK'); }
    else if(stmt.startsWith('REM')||stmt.startsWith("'")){/*comment*/}
    else if(stmt==='RUN') await cmdRun();
    else if(stmt==='LIST') cmdList();
    else if(stmt==='NEW') { program={}; variables={}; arrays={}; printLine('READY.'); printLine(''); setInputStart(); }
    else if(stmt==='CLR') cmdClr();
    else if(stmt==='CLS'||stmt==='HOME'){ screenClear(); }
    else if(stmt.startsWith('DIM '))  cmdDim(stmt.slice(4));
    else if(stmt.startsWith('READ ')) cmdRead(stmt.slice(5));
    else if(stmt==='RESTORE') dataPointer=0;
    else if(stmt.startsWith('DATA ')){/*collected before run*/}
    else if(stmt.startsWith('POKE ')){/*no-op*/}
    else if(stmt.startsWith('LOAD')||stmt.startsWith('SAVE')) printLine('?DEVICE NOT PRESENT  ERROR');
    else if(stmt.match(/^RENUM(BER)?\b/)) cmdRenumber(stmt);
    else if(stmt.match(/^LOCATE\b/))    cmdLocate(stmt.slice(6));
    else printLine('?SYNTAX  ERROR');
  }catch(e){ printLine('?'+(e.message||'ERROR')); }
}

async function cmdPrint(args){
  args=args.trim(); if(!args){printLine('');return;}
  let result='',noNewline=false;
  for(const p of parsePrintArgs(args)){
    if(p===';'){noNewline=true;continue;}
    if(p===','){result+='\t';noNewline=true;continue;}
    noNewline=false; result+=String(evalExpr(p));
  }
  noNewline?print(result):printLine(result);
}

function parsePrintArgs(args){
  const parts=[];let cur='',inStr=false;
  for(const ch of args){
    if(ch==='"'){inStr=!inStr;cur+=ch;continue;}
    if(!inStr&&(ch===';'||ch===',')){if(cur.trim())parts.push(cur.trim());parts.push(ch);cur='';}
    else cur+=ch;
  }
  if(cur.trim())parts.push(cur.trim());return parts;
}

function cmdLet(expr){
  const am=expr.match(/^([A-Z][A-Z0-9]*)\((.+)\)\s*=\s*(.+)$/);
  if(am){const idx=Math.floor(evalExpr(am[2]));if(!arrays[am[1]])arrays[am[1]]=[];arrays[am[1]][idx]=evalExpr(am[3]);return;}
  const eq=expr.indexOf('=');
  if(eq===-1) throw new Error('SYNTAX  ERROR');
  variables[expr.slice(0,eq).trim()]=evalExpr(expr.slice(eq+1).trim());
}

async function cmdInput(args){
  args=args.trim();let prompt='? ',varName=args;
  if(args.startsWith('"')){const q=args.indexOf('"',1);prompt=args.slice(1,q)+' ';varName=args.slice(q+1).replace(/^[;,]\s*/,'').trim();}
  print(prompt);
  setInputStart();
  const val=await waitInput();
  const n=parseFloat(val);
  variables[varName.trim()]=isNaN(n)?val:n;
}

function waitInput(){ waitingForInput=true; return new Promise(r=>{inputResolve=r;}); }

async function cmdIf(args){
  const ti=args.indexOf(' THEN ');
  if(ti===-1) throw new Error('SYNTAX  ERROR');
  const cond=args.slice(0,ti).trim();
  let rest=args.slice(ti+6).trim(),thenPart=rest,elsePart='';
  const ei=rest.indexOf(' ELSE ');
  if(ei!==-1){thenPart=rest.slice(0,ei).trim();elsePart=rest.slice(ei+6).trim();}
  const ok=evalCond(cond);
  if(ok){/^\d+$/.test(thenPart)?await cmdGoto(thenPart):await executeStatement(thenPart);}
  else if(elsePart){/^\d+$/.test(elsePart)?await cmdGoto(elsePart):await executeStatement(elsePart);}
}

function cmdFor(args){
  const m=args.match(/^([A-Z][A-Z0-9]*)\s*=\s*(.+?)\s+TO\s+(.+?)(\s+STEP\s+(.+))?$/);
  if(!m) throw new Error('SYNTAX  ERROR');
  variables[m[1]]=evalExpr(m[2]);
  forStack.push({varName:m[1],limit:evalExpr(m[3]),step:m[5]?evalExpr(m[5]):1,lineIndex:currentLineIndex});
}

async function cmdNext(args){
  const vn=args.trim()||null;
  if(!forStack.length) throw new Error('NEXT WITHOUT FOR');
  const frame=forStack[forStack.length-1];
  if(vn&&vn!==frame.varName) throw new Error('NEXT WITHOUT FOR');
  variables[frame.varName]+=frame.step;
  const done=frame.step>0?variables[frame.varName]>frame.limit:variables[frame.varName]<frame.limit;
  if(!done){currentLineIndex=frame.lineIndex;await runFromIndex(currentLineIndex+1);}
  else forStack.pop();
}

async function cmdGoto(args){
  const n=parseInt(args.trim()),idx=lineNumbers.indexOf(n);
  if(idx===-1) throw new Error('UNDEF\'D STATEMENT  ERROR');
  currentLineIndex=idx; await runFromIndex(idx);
}

async function cmdGosub(args){
  const n=parseInt(args.trim()),idx=lineNumbers.indexOf(n);
  if(idx===-1) throw new Error('UNDEF\'D STATEMENT  ERROR');
  gosubStack.push(currentLineIndex+1);
  currentLineIndex=idx; await runFromIndex(idx);
}

function cmdReturn(){
  if(!gosubStack.length) throw new Error('RETURN WITHOUT GOSUB');
  currentLineIndex=gosubStack.pop()-1;
}

async function cmdRun(startArg){
  loadEditorToProgram();
  cmdClr(false); collectData();
  lineNumbers=Object.keys(program).map(Number).sort((a,b)=>a-b);
  if(!lineNumbers.length){printLine('READY.');printLine('');return;}
  let startIdx=0;
  if(startArg){startIdx=lineNumbers.indexOf(parseInt(startArg));if(startIdx===-1){printLine('?UNDEF\'D STATEMENT  ERROR');return;}}
  running=true; forStack=[]; gosubStack=[];
  await runFromIndex(startIdx);
  if(running){running=false;printLine('\nREADY.');printLine('');}
  setInputStart();
}

async function runFromIndex(start){
  for(let i=start;i<lineNumbers.length&&running;i++){
    currentLineIndex=i;
    await executeStatement(program[lineNumbers[i]]);
    if(currentLineIndex!==i) return;
    await new Promise(r=>setTimeout(r,0));
  }
}

function cmdList(){
  const nums=Object.keys(program).map(Number).sort((a,b)=>a-b);
  if(!nums.length){printLine('READY.');printLine('');return;}
  nums.forEach(n=>printLine(n+' '+program[n]));
  printLine('');printLine('READY.');printLine('');
  setInputStart();
}

function cmdClr(msg=false){
  variables={}; arrays={}; forStack=[]; gosubStack=[]; dataList=[]; dataPointer=0; running=false;
  if(msg){printLine('READY.');printLine('');}
}

function cmdDim(args){
  const m=args.match(/^([A-Z][A-Z0-9]*)\((\d+)\)$/);
  if(!m) throw new Error('SYNTAX  ERROR');
  arrays[m[1]]=new Array(parseInt(m[2])+1).fill(0);
}

function collectData(){
  dataList=[];dataPointer=0;
  Object.keys(program).map(Number).sort((a,b)=>a-b).forEach(n=>{
    const s=program[n].trim();
    if(s.startsWith('DATA ')){
      s.slice(5).split(',').forEach(x=>{const t=x.trim(),v=parseFloat(t);dataList.push(isNaN(v)?t.replace(/^"|"$/g,''):v);});
    }
  });
}

function cmdRead(args){
  args.split(',').forEach(v=>{
    if(dataPointer>=dataList.length) throw new Error('OUT OF DATA  ERROR');
    variables[v.trim()]=dataList[dataPointer++];
  });
}

// ============================================================
//  EXPRESSION EVALUATOR
// ============================================================
function evalExpr(expr){
  expr=expr.trim(); if(!expr) return 0;
  if(expr.startsWith('"')&&expr.endsWith('"')) return expr.slice(1,-1);
  expr=expr.replace(/\bINT\s*\(([^)]+)\)/g,  (_,e)=>Math.floor(evalExpr(e)));
  expr=expr.replace(/\bABS\s*\(([^)]+)\)/g,  (_,e)=>Math.abs(evalExpr(e)));
  expr=expr.replace(/\bSQR\s*\(([^)]+)\)/g,  (_,e)=>Math.sqrt(evalExpr(e)));
  expr=expr.replace(/\bSIN\s*\(([^)]+)\)/g,  (_,e)=>Math.sin(evalExpr(e)));
  expr=expr.replace(/\bCOS\s*\(([^)]+)\)/g,  (_,e)=>Math.cos(evalExpr(e)));
  expr=expr.replace(/\bTAN\s*\(([^)]+)\)/g,  (_,e)=>Math.tan(evalExpr(e)));
  expr=expr.replace(/\bLOG\s*\(([^)]+)\)/g,  (_,e)=>Math.log(evalExpr(e)));
  expr=expr.replace(/\bEXP\s*\(([^)]+)\)/g,  (_,e)=>Math.exp(evalExpr(e)));
  expr=expr.replace(/\bRND\s*\([^)]*\)/g,     ()=>Math.random());
  expr=expr.replace(/\bSGN\s*\(([^)]+)\)/g,  (_,e)=>Math.sign(evalExpr(e)));
  expr=expr.replace(/\bLEN\s*\(([^)]+)\)/g,  (_,e)=>String(evalExpr(e)).length);
  expr=expr.replace(/\bASC\s*\(([^)]+)\)/g,  (_,e)=>String(evalExpr(e)).charCodeAt(0));
  expr=expr.replace(/\bCHR\$\s*\(([^)]+)\)/g,(_,e)=>String.fromCharCode(evalExpr(e)));
  expr=expr.replace(/\bSTR\$\s*\(([^)]+)\)/g,(_,e)=>String(evalExpr(e)));
  expr=expr.replace(/\bVAL\s*\(([^)]+)\)/g,  (_,e)=>parseFloat(evalExpr(e))||0);
  expr=expr.replace(/\bLEFT\$\s*\(([^,]+),([^)]+)\)/g,  (_,s,n)=>String(evalExpr(s)).slice(0,evalExpr(n)));
  expr=expr.replace(/\bRIGHT\$\s*\(([^,]+),([^)]+)\)/g, (_,s,n)=>{const t=String(evalExpr(s));return t.slice(t.length-evalExpr(n));});
  expr=expr.replace(/\bMID\$\s*\(([^,]+),([^,]+),([^)]+)\)/g,(_,s,p,l)=>String(evalExpr(s)).substr(evalExpr(p)-1,evalExpr(l)));
  expr=expr.replace(/\bPEEK\s*\([^)]+\)/g,   ()=>0);
  expr=expr.replace(/\bFRE\s*\([^)]*\)/g,    ()=>38911);
  expr=expr.replace(/\b([A-Z][A-Z0-9]*)\(([^)]+)\)/g,(_,name,idx)=>{
    const i=Math.floor(evalExpr(idx));
    if(!arrays[name])arrays[name]=[];
    return arrays[name][i]||0;
  });
  expr=expr.replace(/\b([A-Z][A-Z0-9]*\$?)\b/g,(match)=>{
    if(/^(AND|OR|NOT|MOD|TO|STEP)$/.test(match)) return match;
    const val=variables[match];
    if(val===undefined) return match.endsWith('$')?'""':'0';
    return typeof val==='string'?JSON.stringify(val):val;
  });
  expr=expr.replace(/\bAND\b/g,'&&').replace(/\bOR\b/g,'||').replace(/\bNOT\b/g,'!');
  try{return Function('"use strict";return('+expr+')')();}catch(e){return 0;}
}

function evalCond(cond){ return !!evalExpr(cond.replace(/<>/g,'!=')); }

// ============================================================
//  INIT
// ============================================================
focusInput();
boot();
setInputStart();
</script>
